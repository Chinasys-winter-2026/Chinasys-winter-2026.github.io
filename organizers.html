            .organizers-office {
                color: #3F92D2;

                padding-right:0.2em;
                text-align: right;
            }
            .organizers-bearer {

            .chair-grid {
                display: grid;
                grid-template-columns: repeat(2, minmax(260px, 1fr));

            .chair-card {

            .chair-photo {

            .chair-info {

            .chair-name {
                display: inline;
                font-size: 1.08em;
                font-weight: 500;
            }
            .chair-name + div {
                display: inline;
                font-size: 1.02em;

            @media screen and (max-width: 700px) {
                .chair-grid {
                    grid-template-columns: 1fr;
